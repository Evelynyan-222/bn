<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bdced6">
  <meta name="description" content="A small space to notice your feelings. Turn your inner weather into a sky.">
  <title>Inner Weather</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23bdced6'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23fff8de'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="sky calm"><div class="cloud one"></div><div class="cloud two"></div></div>
    <div class="sky happy"><div class="sun"></div></div>
    <div class="sky tired"><div class="fog one"></div><div class="fog two"></div></div>
    <div class="sky rainy" id="rain"></div>
    <div class="veil"></div>
  </div>
  <div class="layout">
    <header><span class="mark" aria-hidden="true"></span> INNER WEATHER</header>
    <main>
      <p class="eyebrow">A moment to check in</p>
      <h1>What’s the weather<br><em>inside you</em> today?</h1>
      <p class="invitation">Take a breath. Choose what feels closest.</p>
      <div class="choices" role="group" aria-label="How are you feeling?">
        <button type="button" data-mood="calm" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18a4 4 0 0 1-1-7.9 6 6 0 0 1 11.6-1.5A4.7 4.7 0 1 1 18 18Z"/></svg>Calm</button>
        <button type="button" data-mood="happy" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>Happy</button>
        <button type="button" data-mood="tired" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M2 12h15M7 17h15"/></svg>Tired</button>
        <button type="button" data-mood="overwhelmed" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14a3.5 3.5 0 0 1-.7-6.9A5 5 0 0 1 15 6a4 4 0 1 1 3 8ZM7 18l-1 3m6-3-1 3m6-3-1 3"/></svg>Overwhelmed</button>
      </div>
      <div class="reflection" id="reflection" role="status" aria-live="polite" aria-atomic="true">
        <p class="weather-name" id="weather-name"></p>
        <p class="message" id="message">Every feeling has a place here.</p>
      </div>
    </main>
    <footer>A little space for whatever you’re feeling.</footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
